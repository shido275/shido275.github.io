# Polls the Rumble channel and commits live.json, which the site reads.
#
# Why a workflow instead of a browser call: rumble.com sends no CORS headers,
# so shido275.github.io cannot fetch the channel itself. Running here keeps the
# read server-side. The poller needs no API key or secret: it reads the public
# channel page and keeps only the fields the player uses.
#
# GitHub schedules run on a best-effort basis and can be delayed by several
# minutes under load, so expect the badge to lag a little behind the stream.

name: Rumble live status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rumble-live
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poll the Rumble channel page
        run: node scripts/rumble-live.js

      - name: Commit live.json when the state changed
        run: |
          if git diff --quiet -- live.json; then
            echo "Live status unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git commit -m "Update Rumble live status"
          git push
